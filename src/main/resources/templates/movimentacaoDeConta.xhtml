<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movimentação de Conta</title>
    <link rel="stylesheet" href="/css/global.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        main {
            margin: 50px auto;
            width: 50%;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 10px;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var tipoTransacao = document.getElementById('tipoTransacao');
            var valorInput = document.getElementById('valor');
            
            function toggleValor() {
                if (tipoTransacao.value === 'CONSULTAR_SALDO') {
                    valorInput.disabled = true;
                    valorInput.value = '';
                } else {
                    valorInput.disabled = false;
                }
            }

            tipoTransacao.addEventListener('change', toggleValor);
            toggleValor(); // inicializar estado
        });
    </script>
</head>
<body>
    <h1>Bem-vindo ao Sistema Bancário</h1>
    <h2>Administração - Gerente Agência</h2>
    <main>
        <form th:action="@{/movimentacao}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <label for="titular">Titular:</label>
            <input type="text" id="titular" name="titular" required>

            <label for="numeroConta">Número da Conta:</label>
            <input type="text" id="numeroConta" name="numeroConta" maxlength="8" required>

            <label for="tipoTransacao">Tipo de Transação:</label>
            <select id="tipoTransacao" name="tipoTransacao">
                <option value="DEPOSITO">Depósito</option>
                <option value="SAQUE">Saque</option>
                <option value="CONSULTAR_SALDO">Consultar Saldo</option>
            </select>

            <label for="valor">Valor (se aplicável):</label>
            <input type="number" id="valor" name="valor" step="0.01" placeholder="Digite o valor">

            <button type="submit">Confirmar Transação</button>
        </form>

        <div th:if="${mensagemSucesso}" class="success-message">
            <p th:text="${mensagemSucesso}"></p>
        </div>
        <div th:if="${mensagemErro}" class="error-message">
            <p th:text="${mensagemErro}"></p>
        </div>
        <p></p>
        <a href="/menucontas" class="back-button">Voltar ao Menu de Contas</a>
    </main>
</body>
</html>
